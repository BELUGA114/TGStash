# 生产部署
services:
  stash-listener:
    image: ghcr.io/beluga114/tgstash:latest
    container_name: stash-listener
    network_mode: "host"
    restart: unless-stopped
    environment:
      - TG_API_ID
      - TG_API_HASH
      - RECEIVE_CHAT_ID
      - ARCHIVE_CHAT_ID
      - SCAN_INTERVAL_SECONDS=${SCAN_INTERVAL_SECONDS:-300}
      - BATCH_SIZE=${BATCH_SIZE:-10}
      - UPLOAD_COOLDOWN_SECONDS=${UPLOAD_COOLDOWN_SECONDS:-5}
      - RETRY_MAX_ATTEMPTS=${RETRY_MAX_ATTEMPTS:-3}
      - TDL_NAMESPACE=${TDL_NAMESPACE:-archiver}
      - TDL_THREADS=${TDL_THREADS:-4}
      - TDL_LIMIT=${TDL_LIMIT:-2}
      - TDL_DELAY_SECONDS=${TDL_DELAY_SECONDS:-1}
      - TDL_TIMEOUT_SECONDS=${TDL_TIMEOUT_SECONDS:-0}
      - VIDEO_COMPRESS_ENABLED=${VIDEO_COMPRESS_ENABLED:-false}
      - VIDEO_COMPRESS_MIN_SIZE_MB=${VIDEO_COMPRESS_MIN_SIZE_MB:-100}
      - VIDEO_COMPRESS_CRF=${VIDEO_COMPRESS_CRF:-28}
      - VIDEO_COMPRESS_THREADS=${VIDEO_COMPRESS_THREADS:-4}
      - HTTP_PROXY=${HTTP_PROXY:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - /data/TGStash/session:/data/session
      - /data/TGStash/tdl-session:/root/.tdl
      - /data/TGStash/db:/data/db
      - /data/TGStash/tmp:/data/tmp
