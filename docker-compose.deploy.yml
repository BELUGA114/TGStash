# 生产部署
services:
  stash-listener:
    image: ghcr.io/beluga114/tgstash:latest
    container_name: stash-listener
    network_mode: "host"
    restart: unless-stopped
    environment:
      - TG_API_ID
      - TG_API_HASH
      - RECEIVE_CHAT_ID
      - ARCHIVE_CHAT_ID
      - HTTP_PROXY
      - TDL_NAMESPACE
      - TDL_THREADS
      - TDL_LIMIT
      - TDL_DELAY_SECONDS
      - TDL_TIMEOUT_SECONDS
      - SCAN_INTERVAL_SECONDS=300
      - BATCH_SIZE=10
      - UPLOAD_COOLDOWN_SECONDS=5
      - LOG_LEVEL
    volumes:
      - /data/TGStash/session:/data/session
      - /data/TGStash/tdl-session:/root/.tdl
      - /data/TGStash/db:/data/db
      - /data/TGStash/tmp:/data/tmp
