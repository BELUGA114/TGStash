name: 发布

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  # 同一 tag 重复推送时串行处理，不 cancel-in-progress：
  # 发布跑到一半被取消可能留下推了一半的镜像
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    permissions:
      contents: read
    uses: ./.github/workflows/tests.yml

  build-push:
    name: 构建 → 冒烟 → 推送 GHCR
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/metadata-action@v5
        id: meta
        with:
          # metadata-action 自动转小写：BELUGA114/TGStash → beluga114/tgstash，
          # 这就是现在 ghcr.io/beluga114/tgstash 能对上的原因，别手搓 tag 字符串
          images: ghcr.io/${{ github.repository }}
          # 保留带 v 前缀的完整标签（v2.1.1），并补 v2.1 / v2 便于按精度 pin；
          # 预发布 tag（含连字符，如 v2.2.0-rc1）不会移动 latest 与 v2.1 / v2
          tags: |
            type=ref,event=tag
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - uses: docker/setup-buildx-action@v3

      # 先构建到本地跑冒烟，通过了再推。第二次 build 全量命中 gha 缓存，只要几秒
      - name: 构建并 load
        uses: docker/build-push-action@v6
        with:
          context: .
          file: stash-listener/Dockerfile
          push: false
          load: true
          tags: tgstash:candidate
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 外部二进制 + libx264 编码器
        run: |
          set -euo pipefail
          docker run --rm --entrypoint sh tgstash:candidate -euc '
            ffmpeg  -hide_banner -version >/dev/null
            ffprobe -hide_banner -version >/dev/null
            tdl version >/dev/null
            ffmpeg -hide_banner -encoders | grep -q " libx264 "
            ffmpeg -hide_banner -loglevel error -f lavfi \
                   -i testsrc=size=64x64:rate=1 -frames:v 1 \
                   -c:v libx264 -f null -
          '

      - name: Python 模块导入冒烟
        run: |
          set -euo pipefail
          EXPECTED=$(cd stash-listener && modules=(*.py) && IFS=, && echo "${modules[*]}")
          echo "期望模块：$EXPECTED"
          docker run --rm \
            -e EXPECTED_MODULES="$EXPECTED" \
            -e TG_API_ID=12345 \
            -e TG_API_HASH=testhash \
            -e RECEIVE_CHAT_ID=-1001234567890 \
            -e ARCHIVE_CHAT_ID=-1009876543210 \
            -v "$PWD/.github/smoke.py:/smoke.py:ro" \
            tgstash:candidate python /smoke.py

      - name: 辅助脚本在容器里可用
        run: docker run --rm tgstash:candidate python scripts/delete_message.py --help

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 推送（缓存命中，几乎不重新构建）
        uses: docker/build-push-action@v6
        with:
          context: .
          file: stash-listener/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: 创建 GitHub Release
    needs: build-push
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # actions/checkout 会把 annotated tag 覆盖成轻量 tag：它拿 github.sha（commit）
      # 去比 `git rev-parse refs/tags/<tag>`（annotated tag 返回的是 tag 对象 sha），
      # 两者永远不等，于是补一次 `+<commit-sha>:refs/tags/<tag>` 定向 fetch，
      # refs/tags/<tag> 就直接指向 commit 了 —— 此时 %(contents) 拿到的是 commit
      # message 而不是 tag 注释。--force 必需：本地已有同名 tag，不加会被
      # "would clobber existing tag" 拒绝，静默留下错的那个
      - name: 取回被 checkout 覆盖掉的 annotated tag
        run: git fetch --tags --force origin

      - name: 生成 release 说明（tag 注释 + 自动变更列表）
        env:
          # 走 env 而不是把 ${{ }} 直接插进 run：git 允许 tag 名里带 ; $ | & 反引号
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # 轻量 tag 没有注释对象，%(contents) 自然回落到 commit message，就用它，不卡发布
          # 落成文件而不进 $GITHUB_ENV：没有定界符冲突问题，中文原样保留。
          # 现有 tag 都是 annotated 但未签名，所以 %(contents) 里没有 PGP 块
          git tag -l --format='%(contents)' "$TAG" > release-body.md
          test -s release-body.md
          # 手写 tag 说明之后追加自动生成的变更列表
          echo >> release-body.md
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$TAG" --jq .body >> release-body.md
          cat release-body.md

      - name: gh release create
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          extra=()
          # 带连字符的按预发布处理，与镜像 tag 里 latest 的 enable 条件保持一致
          if [[ "$TAG" == *-* ]]; then
            extra+=(--prerelease)
          fi
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file release-body.md \
            --verify-tag \
            "${extra[@]}"
