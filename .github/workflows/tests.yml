name: 测试

# 可复用：ci.yml（push/PR）和 release.yml（tag）都调它，
# 保证「PR 跑的测试」和「发布前的门禁」永远是同一套步骤
on:
  workflow_call:

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 = 生产镜像（python:3.12-slim），3.13 = 本机 .venv。
        # 两者本来就不一致，只测一个等于放着另一个不管
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            stash-listener/requirements.txt

      - name: 安装依赖
        # TgCrypto 无预编译 wheel，首次要编译（ubuntu-latest 自带 gcc），
        # 编好的 wheel 进 ~/.cache/pip，之后走缓存
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: 安装 ffmpeg
        # 核心归档测试使用真实 ffprobe 和 ffmpeg，不依赖 runner 预装版本。
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: pytest
        run: python -m pytest -ra

  lint:
    name: ruff + pyright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            stash-listener/requirements.txt

      - name: 安装依赖到 .venv
        # 装进 .venv 而不是 runner 自带的 Python：pyrightconfig.json 里写着
        # venvPath/venv，pyright 只从那里找 Kurigram 与 Pillow 的类型，命令行
        # --pythonpath 覆盖不了这两项。这样 CI 跑的就是本机那两条命令
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements-dev.txt

      # 保留现有格式，避免检查引入与行为无关的重排。
      - run: .venv/bin/python -m ruff check --output-format=github .

      # 基线是 0 错。standard 模式盯的是 Kurigram 边界（chat / chat.id 这类
      # Optional）和升级 Kurigram 时的签名漂移，去重与 checkpoint 那些运行期
      # 不变量它管不了，仍然由 pytest 负责
      - run: .venv/bin/python -m pyright
