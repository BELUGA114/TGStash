# 本地开发：docker compose build && docker compose up -d
services:
  stash-listener:
    build:
      context: .
      dockerfile: stash-listener/Dockerfile
    container_name: stash-listener
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data/session:/data/session
      - ./data/tdl-session:/root/.tdl
      - ./data/db:/data/db
      - ./data/tmp:/data/tmp
    healthcheck:
      test: ["CMD", "python", "scripts/healthcheck.py"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
